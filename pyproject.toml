[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqexp"
version = "0.1.0"
description = "CIFAR-10 VQ/ProVQ/SimVQ ablation experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "torchvision>=0.18",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
